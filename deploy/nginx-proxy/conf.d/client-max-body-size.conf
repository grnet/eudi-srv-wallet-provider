# Raise the request body limit from nginx's 1m default.
#
# The platform key attestation endpoints accept an X.509 certificate chain from
# the Android keystore alongside a JWK set. A chain of four or five certificates
# is comfortably under 1m, but the limit is not worth discovering at an interop
# event: nginx answers 413 before the request reaches the service, so the failure
# looks like a client problem rather than a proxy limit.
#
# There is no environment variable for this. nginx-proxy takes proxy-wide
# settings from any .conf file mounted under /etc/nginx/conf.d.
client_max_body_size 4m;
