# The wallet provider, plus the shared edge. See deploy/README.md.
#
# Use the Deploy workflow, not compose directly.
#
# This repository owns nginx-proxy, acme-companion and proxy-net, defined here
# and nowhere else. Every other stack declares proxy-net external, so this one
# must be up before anything else can be routed or get a certificate.

name: eudiw

# The landing page's logos, as configs, kept out of this file for their size.
include:
  - landing-logos.yaml

services:

  # Watches the Docker socket and writes an nginx vhost for every container that
  # sets VIRTUAL_HOST. The only container in the deployment that publishes ports.
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: docker-gen only needs to watch events.
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - proxy-certs:/etc/nginx/certs
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - proxy-conf:/etc/nginx/conf.d
    configs:
      # Proxy-wide settings: nginx-proxy reads any .conf in conf.d, and there is
      # no environment variable for client_max_body_size.
      - source: client-max-body-size
        target: /etc/nginx/conf.d/client-max-body-size.conf
      - source: block-ip-access
        target: /etc/nginx/conf.d/block-ip-access.conf
      # Replaces the generated port-80 server for the host. The 00- prefix is
      # load-bearing: nginx keeps the first server with a given name and port.
      - source: http-with-crl-exception
        target: /etc/nginx/conf.d/00-http-with-crl-exception.conf
      # Per-vhost, server-block scope. Adds locations rather than modifying
      # generated ones, which is what the plain <host> file is for.
      - source: well-known-discovery
        target: /etc/nginx/vhost.d/${EDGE_HOST:?set in stack.env}
      # Per-VIRTUAL_PATH, inside one location. Named <host>_<sha1 of path>_location.
      - source: verifier-ui-base-href
        target: /etc/nginx/vhost.d/${EDGE_HOST}_fd64cf69ae9646446b46d190dd78629487e3be2f_location
      - source: issuer-frontend-static
        target: /etc/nginx/vhost.d/${EDGE_HOST}_cf70a67df60bdc2f86a0213e390eaf0a1185538d_location
      - source: wallet-provider-redirect
        target: /etc/nginx/vhost.d/${EDGE_HOST}_6ce92592c2ac02a738d464460ca179a499a84834_location
    networks:
      - proxy-net

  # A certificate per LETSENCRYPT_HOST, written into the volumes nginx-proxy
  # reads. HTTP-01 resolves from public DNS, so the name must point at this box.
  acme-companion:
    image: nginxproxy/acme-companion:2.8
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-certs:/etc/nginx/certs
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - proxy-conf:/etc/nginx/conf.d
      - acme-state:/etc/acme.sh
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?set in stack.env}
      # Point at the staging CA while iterating; its rate limits are far higher
      # and its certificates are not publicly trusted.
      # ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory
    networks:
      - proxy-net

  postgres:
    image: postgres:18.3-alpine
    container_name: eudiw-wallet-provider-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?repository secret, see deploy/README.md}
    volumes:
      # Postgres 18 wants a single mount at /var/lib/postgresql and puts the data
      # in a subdirectory. Mounting /var/lib/postgresql/data, correct up to 17,
      # makes the entrypoint refuse to start.
      - postgres-data:/var/lib/postgresql
    configs:
      # schemas/postgresql/V1.sql, inlined: a bind mount would resolve on the
      # remote filesystem under DOCKER_HOST=ssh://. Keep the two in sync.
      - source: init-sql
        target: /docker-entrypoint-initdb.d/V1.sql
    healthcheck:
      # CMD, not CMD-SHELL: the shell form takes a single string and drops the
      # remaining arguments, leaving pg_isready to connect as "root".
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wallet-provider

  # Builds the JWT signing keystore into a named volume, on every deploy, from
  # the key WE BUILD onboarded: the signing-key secret and SIGNING_CERT_PEM.
  #
  # The keystore's chain, less a self-signed root, is published at /jwks and
  # sent as the x5c of every attestation, where issuers match it against
  # WE BUILD's Wallet Providers list. Changing the key invalidates every
  # attestation already issued.
  keystore-init:
    image: eclipse-temurin:25-jdk
    container_name: eudiw-wallet-provider-keystore-init
    volumes:
      - signing-keystore:/keystore
    # Working copies of the key go here, not into the container's own layer,
    # which outlives the run. The secret itself does stay in the stopped
    # container, as the issuer's does: readable only with Docker access to the
    # box, which can read the keystore and its password anyway.
    tmpfs:
      - /work
    command:
      - sh
      - -euc
      - |
        cd /work
        printf '%s\n' "$${SIGNING_CERT_PEM}" > chain.pem
        # Compose writes the secret without its final newline; put it back.
        printf '%s\n' "$$(cat /run/secrets/signing-key)" > key.pem
        if [ "$$(openssl pkey -in key.pem -pubout)" != "$$(openssl x509 -in chain.pem -noout -pubkey)" ]; then
          echo "the signing key does not belong to the first certificate in SIGNING_CERT_PEM" >&2
          exit 1
        fi
        openssl pkcs12 -export -in chain.pem -inkey key.pem \
          -name signing_alias -out out.p12 -passout pass:"$${SIGNINGKEY_KEYSTOREPASSWORD}"
        # Built beside the old one and moved over it, so a failure leaves the
        # previous keystore in place.
        rm -f /keystore/keystore.jks.new
        keytool -importkeystore -noprompt \
          -srckeystore out.p12 -srcstoretype PKCS12 \
          -srcstorepass "$${SIGNINGKEY_KEYSTOREPASSWORD}" \
          -destkeystore /keystore/keystore.jks.new -deststoretype JKS \
          -deststorepass "$${SIGNINGKEY_KEYSTOREPASSWORD}"
        chmod 644 /keystore/keystore.jks.new
        mv -f /keystore/keystore.jks.new /keystore/keystore.jks
        echo "signing as $$(openssl x509 -in chain.pem -noout -subject)"
    environment:
      SIGNINGKEY_KEYSTOREPASSWORD: ${SIGNINGKEY_KEYSTOREPASSWORD:?repository secret, see deploy/README.md}
      # The onboarding PEM as downloaded: our certificate, then its CA.
      SIGNING_CERT_PEM: ${SIGNING_CERT_PEM:?repository variable, see deploy/README.md}
    secrets:
      - signing-key
    networks:
      - wallet-provider

  provider:
    container_name: eudiw-wallet-provider
    # Pinned by the deploy workflow to a sha- tag, which names exactly one build.
    # A branch tag would move under a running deployment.
    image: ${WALLET_PROVIDER_IMAGE:?set by the deploy workflow}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keystore-init:
        condition: service_completed_successfully
    expose:
      # Not published. nginx-proxy reaches this over proxy-net; nothing binds a
      # host port except the proxy itself.
      - "8080"
    environment:
      VIRTUAL_HOST: ${WALLET_PROVIDER_HOST:?set in stack.env}
      VIRTUAL_PORT: "8080"
      # VIRTUAL_DEST=/ strips the prefix, so the container still sees /jwks.
      VIRTUAL_PATH: ${WALLET_PROVIDER_PATH:-/}
      VIRTUAL_DEST: /
      LETSENCRYPT_HOST: ${WALLET_PROVIDER_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

      DATABASE_URL: r2dbc:pool:postgresql://postgres@postgres:5432/postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?repository secret, see deploy/README.md}

      SIGNINGKEY_KEYSTOREFILE: /keystore/keystore.jks
      SIGNINGKEY_KEYSTOREPASSWORD: ${SIGNINGKEY_KEYSTOREPASSWORD:?repository secret, see deploy/README.md}
      SIGNINGKEY_KEYSTORETYPE: JKS
      SIGNINGKEY_KEYALIAS: signing_alias
      SIGNINGKEY_KEYPASSWORD: ${SIGNINGKEY_KEYSTOREPASSWORD}
      SIGNINGKEY_ALGORITHM: ES256
      # Unused by the app: a new certificate changes it, so compose recreates
      # the provider and it loads the new keystore.
      SIGNING_CERT_SHA256: ${SIGNING_CERT_SHA256:?set by the deploy workflow}

      CLIENTID: ${CLIENTID:?set in stack.env}

      # Signed into the wallet unit attestation as `iss` and validated by the
      # wallet, so it must be the public name rather than the in-network one.
      # https once the certificate is issued.
      ISSUER_PUBLICURL: ${ISSUER_PUBLICURL:?set in stack.env}

      KEYATTESTATION_CERTIFICATION: ${KEYATTESTATION_CERTIFICATION:?set in stack.env}
      WALLETINSTANCEATTESTATION_WALLETNAME: ${WALLET_NAME:?set in stack.env}
      WALLETINSTANCEATTESTATION_WALLETLINK: ${WALLET_LINK:?set in stack.env}
      WALLETINSTANCEATTESTATION_WALLETVERSION: ${WALLET_VERSION:?set in stack.env}
      WALLETINSTANCEATTESTATION_WALLETSOLUTIONCERTIFICATIONINFORMATION: ${WALLET_CERTIFICATION_INFO:?set in stack.env}

      # Every attestation issued allocates an index on the status list, which is
      # a shared service holding live data. The allocation is not reversible.
      TOKENSTATUSLISTSERVICE_SERVICEURL: ${TOKENSTATUSLISTSERVICE_SERVICEURL:?set in stack.env}
      TOKENSTATUSLISTSERVICE_APIKEY: ${TOKENSTATUSLISTSERVICE_APIKEY:?repository secret, see deploy/README.md}
    volumes:
      - signing-keystore:/keystore:ro
    networks:
      # Both: proxy-net for inbound traffic, wallet-provider to reach postgres.
      - proxy-net
      - wallet-provider

  # The demo's front door at the hostname root: what is here, where to start,
  # and what a partner needs to trust it. One static page, no JavaScript.
  #
  # Here because it describes the routes this stack's edge defines, so the two
  # change together. The root used to be the status list's, which never used
  # it; that stack now holds only /token_status_list and /identifier_list.
  landing:
    image: nginx:1.29.1-alpine
    container_name: eudiw-landing
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: ${EDGE_HOST}
      VIRTUAL_PORT: "80"
      # Catches everything no other service claims, so unknown paths get this
      # container's plain 404 rather than someone else's.
      VIRTUAL_PATH: /
      LETSENCRYPT_HOST: ${EDGE_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Unused by nginx: a hash of the rendered page and its config, so a change
      # to either, or to a stack.env value in the page, recreates this container.
      LANDING_SHA256: ${LANDING_SHA256:?set by the deploy workflow}
    configs:
      - source: landing-html
        target: /usr/share/nginx/html/index.html
      - source: landing-nginx
        target: /etc/nginx/conf.d/default.conf
      - source: landing-eudi-wallet-svg
        target: /usr/share/nginx/html/landing/eudi-wallet.svg
      - source: landing-govgr-beta-svg
        target: /usr/share/nginx/html/landing/govgr-beta.svg
    networks:
      - proxy-net

configs:
  # Every link to this demo is relative, so nothing here names the host. The
  # fingerprint is IACA_SHA256 in stack.env, and has to match the certificate
  # served at /pki/. The wallet app's link and certificate are in stack.env too.
  #
  # The header is the EUDI Wallet logo beside gov.gr BETA's, as in the Android
  # wallet's home screen and the verifier UI, gov.gr the larger of the two. In
  # dark mode it is a white band: gov.gr has a logo for dark backgrounds, but
  # the EUDI Wallet one does not. The logos are in landing-logos.yaml.
  landing-html:
    content: |
      <!doctype html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>EUDI Wallet demo · GRNET</title>
      <style>
        :root { --fg: #1b1f24; --muted: #57606a; --line: #d8dee4; --rule: #eef1f4; --code: #f3f5f7; --card: #f6f8fa; --link: #0550ae; }
        @media (prefers-color-scheme: dark) {
          :root { --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --rule: #21262d; --code: #161b22; --card: #161b22; --link: #4493f8; }
          body { background: #0d1117; }
          header { background: #fff; border: 0; border-radius: 8px; padding: .75rem 1rem; }
        }
        * { box-sizing: border-box; }
        /* The tables get the full width; running text keeps a readable line length. */
        body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 62rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; color: var(--fg); }
        p { max-width: 46rem; }
        h1 { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); line-height: 1.2; margin: 0 0 .35rem; }
        h2 { font-size: 1.1rem; margin: 2.5rem 0 .75rem; border-bottom: 1px solid var(--line); padding-bottom: .3rem; }
        .lead { color: var(--muted); margin-top: 0; }
        a { color: var(--link); text-underline-offset: .15em; }
        a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
        header { display: flex; align-items: center; gap: 1rem; padding-bottom: 1.25rem; margin-bottom: 2rem; border-bottom: 1px solid var(--line); }
        header img { display: block; min-width: 0; height: auto; }

        /* Try it: the three steps of the demo, each one link. Side by side when
           all three fit, else one under the other, never two and one. */
        .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; grid-template-columns: 1fr; counter-reset: step; }
        @media (min-width: 50rem) { .steps { grid-template-columns: repeat(3, 1fr); } }
        .steps li { counter-increment: step; }
        .steps a { display: flex; flex-direction: column; gap: .2rem; height: 100%; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; text-decoration: none; }
        .steps a:hover { border-color: var(--link); }
        .steps a::before { content: counter(step); display: grid; place-items: center; width: 1.6rem; height: 1.6rem; margin-bottom: .35rem; border-radius: 50%; background: var(--link); color: #fff; font-size: .85rem; font-weight: 600; }
        .steps strong { color: var(--link); }
        .steps span { color: var(--muted); font-size: .95rem; }

        table { border-collapse: collapse; width: 100%; }
        td { padding: .55rem 1rem .55rem 0; vertical-align: top; border-bottom: 1px solid var(--rule); }
        td:first-child { width: 1%; white-space: nowrap; padding-right: 1.5rem; }
        code { font: .875em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }
        /* A SHA-256 fingerprint, 32 bytes as "XX:", always two lines of 16, so a
           line never ends inside a byte. 48ch is 16 bytes; the font shrinks to fit
           narrow screens (48ch of monospace plus padding is about 29.5em). */
        code.fp { display: block; width: calc(48ch + .7em); word-break: break-all; font-size: min(.875rem, calc((100vw - 3rem) / 30)); padding: .4em .35em; line-height: 1.6; }
        .note { color: var(--muted); font-size: .95rem; }
        footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }

        /* Phones: each table row becomes a label over its value. */
        @media (max-width: 40rem) {
          body { padding-top: 1.25rem; }
          header { margin-bottom: 1.5rem; }
          h2 { margin-top: 2rem; }
          table, tbody, tr, td { display: block; width: auto; }
          tr { padding: .6rem 0; border-bottom: 1px solid var(--rule); }
          td { padding: 0; border: 0; }
          td:first-child { width: auto; white-space: normal; padding: 0 0 .2rem; font-weight: 600; }
        }
      </style>
      </head>
      <body>
      <header>
        <img src="/landing/eudi-wallet.svg" alt="EU Digital Identity Wallet" width="123" height="40">
        <img src="/landing/govgr-beta.svg" alt="gov.gr beta" width="173" height="52">
      </header>
      <h1>EUDI Wallet demo</h1>
      <p class="lead">GRNET's deployment of the EU Digital Identity Wallet reference services, for WE BUILD.</p>

      <h2>Try it</h2>
      <ol class="steps">
        <li><a href="${WALLET_RELEASES_URL:?set in stack.env}"><strong>Wallet app</strong><span>Install EUDI Wallet GR on an Android phone. See <em>Wallet app</em> below.</span></a></li>
        <li><a href="/frontend/"><strong>Issuer frontend</strong><span>Request a PID into your wallet.</span></a></li>
        <li><a href="/verifier-ui/"><strong>Verifier UI</strong><span>Ask a wallet to present credentials, as a relying party would.</span></a></li>
      </ol>

      <h2>Services</h2>
      <table>
        <tr><td><a href="/issuer/">PID issuer</a></td><td>OpenID4VCI credential issuer. Metadata at <a href="/.well-known/openid-credential-issuer/issuer"><code>/.well-known/<wbr>openid-credential-issuer/<wbr>issuer</code></a>.</td></tr>
        <tr><td><a href="/issuer/oidc/">Authorization server</a></td><td>OAuth for the issuer. Metadata at <a href="/.well-known/oauth-authorization-server/issuer/oidc"><code>/.well-known/<wbr>oauth-authorization-server/<wbr>issuer/<wbr>oidc</code></a>.</td></tr>
        <tr><td><a href="/token_status_list/swagger/">Status list</a></td><td>Revocation status of issued credentials and attestations.</td></tr>
        <tr><td><a href="/wallet-provider/swagger">Wallet provider</a></td><td>Wallet instance and key attestations. Signing keys at <a href="/wallet-provider/jwks"><code>/wallet-provider/<wbr>jwks</code></a>.</td></tr>
        <tr><td><a href="/verifier/wallet/public-keys.json">Verifier backend</a></td><td>OpenID4VP. The key its request objects are signed with.</td></tr>
      </table>

      <h2>Trusting this issuer</h2>
      <p>Credentials from this demo chain to GRNET's IACA. Configure it as a trust anchor, and check the fingerprint of what you downloaded against the one below.</p>
      <table>
        <tr><td><a href="/pki/root-ca-grnet.pem">IACA certificate</a></td><td><code>CN=PID Issuer CA - GR 01, O=GRNET, C=GR</code></td></tr>
        <tr><td>SHA-256</td><td><code class="fp">${IACA_SHA256:?set in stack.env}</code></td></tr>
        <tr><td><a href="/revocation/crl.pem">Revocation list</a></td><td>The CRL named in the certificate, DER-encoded. Certificates point at it over plain http, which is normal for CRLs: the list itself is signed.</td></tr>
      </table>

      <h2>Wallet app</h2>
      <p>EUDI Wallet GR, GRNET's Android build of the reference wallet, set up for this demo's issuer and wallet provider. Download the APK from its <a href="${WALLET_RELEASES_URL}">releases</a>: take the one marked <strong>Latest</strong>.</p>
      <table>
        <tr><td>Signing certificate SHA-256</td><td><code class="fp">${WALLET_APK_CERT_SHA256:?set in stack.env}</code></td></tr>
      </table>
      <p class="note">To install it, allow your browser to install unknown apps when Android asks.</p>

      <footer><strong>Demo services - Test data only.</strong> Operated by <a href="https://grnet.gr/">GRNET</a>.</footer>
      </body>
      </html>

  # Serves the page and its logos and nothing else: every other path is a plain
  # 404, since this is the catch-all for the hostname. No scripts, so the policy
  # can be strict. The logos are files rather than inline <svg>, so they are
  # served as published: inlined, the gov.gr one would lose its XML prolog and
  # its <style> would apply to the whole page.
  landing-nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy no-referrer always;
          location = / {
              try_files /index.html =404;
          }
          location /landing/ {
              try_files $$uri =404;
          }
          location / {
              return 404;
          }
      }

  # The verifier UI is an Angular SPA: it emits relative asset paths and a
  # <base href="/">, so behind /verifier-ui/ the browser would fetch every
  # stylesheet and script from the host root, which is the status list. The page
  # returns 200 and renders blank.
  #
  # Rewritten here rather than in eudi-web-verifier so that fork keeps zero
  # drift from upstream: the alternatives both need a change to its Dockerfile.
  # sha1("/verifier-ui/") = fd64cf69ae9646446b46d190dd78629487e3be2f
  verifier-ui-base-href:
    content: |
      sub_filter '<base href="/">' '<base href="/verifier-ui/">';
      sub_filter_once off;

  # The issuer frontend's templates use url_for('static'), 140 times, which is
  # correct Flask. But nothing tells the app it lives under /frontend/, so
  # url_for emits absolute /static/... and the browser drops the prefix,
  # hitting the status list at the root. Every stylesheet, script and image
  # 404s while the page itself returns 200.
  #
  # The app-side fix is SCRIPT_NAME or ProxyFix in the WSGI stack; it ignores an
  # X-Script-Name header today, verified. Rewriting here keeps that fork free of
  # deployment-specific changes, as with the verifier UI above.
  # sha1("/frontend/") = cf70a67df60bdc2f86a0213e390eaf0a1185538d
  issuer-frontend-static:
    content: |
      sub_filter 'href="/static/' 'href="/frontend/static/';
      sub_filter 'src="/static/' 'src="/frontend/static/';
      sub_filter_once off;

  # Nothing tells the wallet provider it lives under /wallet-provider/, so its
  # absolute paths drop the prefix and reach the status list's 404:
  # - it redirects / to its Swagger UI as /swagger. nginx's default
  #   proxy_redirect only rewrites absolute URLs naming the upstream; the
  #   second one adds the relative form.
  # - the Swagger UI page loads /swagger/openapi.json, and its OAuth2 redirect
  #   is under /swagger/ too.
  # - the spec has no servers, so Swagger UI's "Try it out" calls the API at
  #   the host root. A servers entry with the prefix goes in before "paths".
  # Kept here rather than in the app, as with the two rewrites above.
  # sha1("/wallet-provider/") = 6ce92592c2ac02a738d464460ca179a499a84834
  wallet-provider-redirect:
    content: |
      proxy_redirect default;
      proxy_redirect / /wallet-provider/;
      sub_filter_types application/json;
      sub_filter "'/swagger/" "'/wallet-provider/swagger/";
      sub_filter '"paths": {' '"servers": [{"url": "/wallet-provider"}], "paths": {';
      sub_filter_once off;

  # RFC 8414 puts discovery metadata at the host root regardless of a service's
  # path, and on this hostname the root belongs to the status list. Without these
  # rules a wallet gets its 404 instead. See deploy/README.md.
  #
  # Upstream names are <host>-<sha1 of VIRTUAL_PATH>. Safe to deploy before the
  # target exists: nginx resolves an unknown upstream per request, so these
  # return 502 rather than failing to start.
  well-known-discovery:
    content: |
      # /issuer  -> sha1("/issuer/")
      location ~ ^/\.well-known/(openid-credential-issuer|openid-configuration|oauth-authorization-server)/issuer$ {
          proxy_pass http://${EDGE_HOST}-63f4327c3fa4d49abd74fe2d0bd693119ac65aa7/.well-known/$1;
      }
      # /issuer/oidc  -> sha1("/issuer/oidc/"). The authorization server,
      # nested under the issuer because upstream assumes <issuer>/oidc.
      location ~ ^/\.well-known/(openid-configuration|oauth-authorization-server)/issuer/oidc$ {
          proxy_pass http://${EDGE_HOST}-21f4678fd8adba8903ca9c631d21ba6ce9802c0c/.well-known/$1;
      }
      # /frontend  -> sha1("/frontend/"). It serves signed metadata under its
      # own identity, so it is a credential issuer for discovery purposes, and
      # it is its own authorization server too: no authorization_servers, and
      # issuer = <frontend> in its AS metadata. So all three forms, as /issuer.
      location ~ ^/\.well-known/(openid-credential-issuer|openid-configuration|oauth-authorization-server)/frontend$ {
          proxy_pass http://${EDGE_HOST}-cf70a67df60bdc2f86a0213e390eaf0a1185538d/.well-known/$1;
      }
      # No resolver needed, and a missing upstream does not stop nginx loading:
      # the $1 makes each proxy_pass variable, so the name is looked up per
      # request, among nginx-proxy's upstream groups first. Checked 2026-09-24.

  # Requests without a known Host get 444, nginx closing the connection with no
  # response. The default 503 tells a scanner something is here worth probing.
  block-ip-access:
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          return 444;
      }
      server {
          listen 443 ssl default_server;
          listen [::]:443 ssl default_server;
          server_name _;
          ssl_reject_handshake on;
          return 444;
      }

  # The IACA names http://<host>/revocation/crl.pem as its CRL distribution
  # point. Plain http is normal for CRLs, and a JVM verifier will not follow an
  # http to https redirect, so that one path must answer on port 80.
  #
  # nginx-proxy cannot express this. HTTPS_METHOD is per hostname, not per path,
  # so noredirect on the CRL container would drop the redirect and HSTS for every
  # service here, and the generated port-80 server has no include hook. So this
  # replaces it: loaded before default.conf, it is the server nginx keeps, and
  # the generated one is ignored with a "conflicting server name" warning.
  #
  # It must keep doing what the generated one did. The ACME location is copied
  # verbatim from nginx-proxy 1.11's template: without it certificate renewal
  # fails, silently, weeks later. Recheck it when upgrading nginx-proxy.
  #
  # The upstream resolves per request through Docker's DNS, so a missing CRL
  # container is a 502 on this path rather than an nginx that will not start.
  # eudiw-crl is its container_name in eudi-srv-web-issuing-eudiw-py; CRL_PATH
  # must match that stack's.
  http-with-crl-exception:
    content: |
      server {
          listen 80;
          server_name ${EDGE_HOST};
          access_log /var/log/nginx/access.log;

          location ^~ /.well-known/acme-challenge/ {
              auth_basic off;
              auth_request off;
              allow all;
              root /usr/share/nginx/html;
              try_files $$uri =404;
              break;
          }

          location ^~ ${CRL_PATH:?set in stack.env} {
              resolver 127.0.0.11 valid=30s;
              set $$crl_upstream http://eudiw-crl;
              proxy_pass $$crl_upstream;
              proxy_set_header Host $$host;
          }

          location / {
              return 301 https://$$host$$request_uri;
          }
      }

  # The platform key attestation endpoints take an X.509 chain from the Android
  # keystore alongside a JWK set. Under nginx's 1m default a large one would get
  # a 413 from the proxy before reaching the service, which reads as a client
  # error rather than a proxy limit.
  client-max-body-size:
    content: |
      client_max_body_size 4m;

  init-sql:
    content: |
      CREATE TABLE IF NOT EXISTS challenges (id BIGSERIAL PRIMARY KEY, "value" bytea NOT NULL, created_at TIMESTAMP NOT NULL, expires_at TIMESTAMP NOT NULL, unused BOOLEAN NOT NULL);
      ALTER TABLE challenges ADD CONSTRAINT challenges_value_unique_idx UNIQUE ("value");
      CREATE SEQUENCE IF NOT EXISTS challenges_id_seq START WITH 1 MINVALUE 1 MAXVALUE 9223372036854775807;

secrets:
  # The attestation signing key. A secret, so `docker inspect` does not show it.
  signing-key:
    environment: SIGNING_KEY_PEM

volumes:
  proxy-certs:
  proxy-vhost:
  proxy-html:
  proxy-conf:
  acme-state:
  postgres-data:
  signing-keystore:

networks:
  # Created here and declared external by every other service repository.
  proxy-net:
    name: proxy-net
  # Private to this stack.
  wallet-provider:
    name: eudiw-wallet-provider
