# The two logos in the landing page's header, included by compose.yaml. In a
# file of their own so that page's markup stays readable; see "The landing page
# at /" in deploy/README.md.
#
# Both are the verifier UI's, unmodified, as served at
# /verifier-ui/assets/: ic-logo.svg and logo_govgr_pos.svg, which the Android
# wallet's drawables were converted from too. Per the gov.gr brand guide,
# https://guide.services.gov.gr/docs/brand, no distortion, cropping or
# recolouring. Only line endings differ: YAML turns the gov.gr file's CRLF
# into LF.
#
# To replace one, paste the new file in, indented. A $ in it would need
# doubling, or compose would read it as a variable.

