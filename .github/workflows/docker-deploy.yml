# Deploy to the EC2 box.
#
# Manually triggered, never on push, so merging a branch cannot change what is
# running. Pick the image tag to deploy; it defaults to the SHA tag of the commit
# the workflow runs on, which names exactly one build.
#
# The deploy drives the remote Docker daemon over SSH rather than copying files
# to the server: DOCKER_HOST=ssh://target means the runner's compose client
# controls the server's daemon. The compose file and the environment are read on
# the runner and never land on the box, so there is no server-side config to
# drift or be edited by hand. Only containers, named volumes and the Docker
# socket exist there.
#
# This repository owns the edge for the whole deployment, so this workflow also
# brings up nginx-proxy and creates the proxy-net network that the other service
# repositories join.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha- tag of this commit)'
        required: false
        type: string
      # up -d is a no-op when nothing in the service definition changed, so a
      # redeploy of the same tag does not restart anything.
      force_recreate:
        description: 'Recreate containers even if nothing changed'
        required: false
        default: false
        type: boolean

concurrency:
  # One deploy at a time. Two compose clients against the same daemon would race.
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    env:
      DOCKER_HOST: ssh://target
      COMPOSE: docker compose -f deploy/compose.yaml -p eudiw

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Resolve the image tag
        id: image
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="sha-${{ github.sha }}"
          fi
          image="${REGISTRY}/${IMAGE_NAME}:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Deploying $image"

      # Authenticated on the runner. The credentials are forwarded to the remote
      # daemon for the pull, so the box needs no registry login of its own.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # config and known_hosts are committed under deploy/ssh/: hostnames, ports
      # and host keys are public data, and keeping them in git makes a change to
      # them reviewable. Only the private key is a secret.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" ]]; then
            echo "::error::SSH_KEY is not set; see deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 deploy/ssh/config ~/.ssh/config
          install -m 644 deploy/ssh/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/eudiw-deploy
          chmod 600 ~/.ssh/eudiw-deploy
          ssh -o BatchMode=yes target 'echo "connected to $(hostname)"'

      # Compose interpolates ${...} client-side, here on the runner, and sends
      # the daemon an already-expanded spec. So the values only have to exist in
      # this step's environment; nothing is written to disk and nothing lands on
      # the server.
      #
      # Adding a key means two edits: create the repository secret, and add it
      # below.
      - name: Pull and roll
        env:
          WALLET_PROVIDER_IMAGE: ${{ steps.image.outputs.image }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SIGNINGKEY_KEYSTOREPASSWORD: ${{ secrets.SIGNINGKEY_KEYSTOREPASSWORD }}
          TOKENSTATUSLISTSERVICE_APIKEY: ${{ secrets.TOKENSTATUSLISTSERVICE_APIKEY }}
        run: |
          set -euo pipefail
          for k in DATABASE_PASSWORD SIGNINGKEY_KEYSTOREPASSWORD TOKENSTATUSLISTSERVICE_APIKEY; do
            if [[ -z "${!k:-}" ]]; then
              echo "::error::$k is not set; see deploy/README.md"
              exit 1
            fi
          done

          export COMPOSE_ENV_FILES=deploy/stack.env

          recreate=""
          [[ "${{ inputs.force_recreate }}" == "true" ]] && recreate="--force-recreate"

          $COMPOSE pull
          $COMPOSE up -d --remove-orphans $recreate

      # A green `up -d` only means compose accepted the configuration. It does
      # not mean the containers are still running a moment later, so check.
      - name: Verify
        run: |
          set -uo pipefail
          fail=0

          echo "── containers ──"
          for c in nginx-proxy eudiw-wallet-provider-db eudiw-wallet-provider; do
            state=""
            for _ in $(seq 1 12); do
              state=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo absent)
              [[ "$state" == "running" ]] && break
              sleep 5
            done
            if [[ "$state" == "running" ]]; then
              echo "  ok   $c"
            else
              echo "  FAIL $c ($state)"
              docker logs --tail 20 "$c" 2>&1 | sed 's/^/       /' || true
              fail=1
            fi
          done

          echo "── networks ──"
          for n in proxy-net eudiw-wallet-provider; do
            if docker network inspect "$n" >/dev/null 2>&1; then
              echo "  ok   $n"
            else
              echo "  FAIL $n missing"
              fail=1
            fi
          done

          echo "── provider attached to proxy-net ──"
          if docker inspect -f '{{json .NetworkSettings.Networks}}' eudiw-wallet-provider 2>/dev/null | grep -q '"proxy-net"'; then
            echo "  ok"
          else
            echo "  FAIL the proxy cannot reach the provider"
            fail=1
          fi

          echo "── nginx config valid ──"
          if docker exec nginx-proxy nginx -t >/dev/null 2>&1; then
            echo "  ok"
          else
            docker exec nginx-proxy nginx -t 2>&1 | sed 's/^/       /'
            fail=1
          fi

          # Through the proxy, by Host header, so this exercises the vhost rather
          # than the container directly. The path carries WALLET_PROVIDER_PATH:
          # the service moved off the host root when the status list took it.
          #
          # Retried, because the JVM takes a few seconds past `up -d` before it
          # answers and a 502 in that window is a slow start, not a bad deploy.
          echo "── service answers through the proxy ──"
          host=$(grep -E '^EDGE_HOST=' deploy/stack.env | cut -d= -f2)
          path=$(grep -E '^WALLET_PROVIDER_PATH=' deploy/stack.env | cut -d= -f2)
          code=000
          for _ in $(seq 1 12); do
            code=$(docker run --rm --network proxy-net curlimages/curl:8.11.1 \
                     -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     -H "Host: $host" "http://nginx-proxy${path}jwks" || echo 000)
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          if [[ "$code" == "200" ]]; then
            echo "  ok   ${path}jwks returned 200"
          else
            echo "  FAIL ${path}jwks returned $code"
            fail=1
          fi

          [[ "$fail" -eq 0 ]] && echo "deploy verified" || { echo "verification failed"; exit 1; }

      - name: Clean up
        if: always()
        run: docker image prune -f || true
