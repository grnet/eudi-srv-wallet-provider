# Deploy to the EC2 box.
#
# Manually triggered, never on push, so merging a branch cannot change what is
# running. Pick the image tag to deploy; it defaults to the SHA tag of the commit
# the workflow runs on, which names exactly one build.
#
# The deploy drives the remote Docker daemon over SSH rather than copying files
# to the server: DOCKER_HOST=ssh://target means the runner's compose client
# controls the server's daemon. The compose file and the environment are read on
# the runner and never land on the box, so there is no server-side config to
# drift or be edited by hand. Only containers, named volumes and the Docker
# socket exist there.
#
# This repository owns the edge for the whole deployment, so this workflow also
# brings up nginx-proxy and creates the proxy-net network that the other service
# repositories join.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha- tag of this commit)'
        required: false
        type: string
      # up -d is a no-op when nothing in the service definition changed, so a
      # redeploy of the same tag does not restart anything.
      force_recreate:
        description: 'Recreate containers even if nothing changed'
        required: false
        default: false
        type: boolean

concurrency:
  # One deploy at a time. Two compose clients against the same daemon would race.
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    env:
      DOCKER_HOST: ssh://target
      COMPOSE: docker compose -f deploy/compose.yaml -p eudiw

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Resolve the image tag
        id: image
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="sha-${{ github.sha }}"
          fi
          image="${REGISTRY}/${IMAGE_NAME}:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Deploying $image"

      # Authenticated on the runner. The credentials are forwarded to the remote
      # daemon for the pull, so the box needs no registry login of its own.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail early, with a reason, if the image is not in the registry yet.
      - name: Check the image is built
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          if err=$(docker buildx imagetools inspect "$IMAGE" 2>&1 >/dev/null); then
            echo "found $IMAGE"
          elif grep -q 'not found' <<<"$err"; then
            echo "::error::$IMAGE is not in the registry. Wait for its Docker build to finish, or pass an image tag that exists."
            exit 1
          else
            echo "$err"
            echo "::error::could not look up $IMAGE"
            exit 1
          fi

      # config and known_hosts are committed under deploy/ssh/: hostnames, ports
      # and host keys are public data, and keeping them in git makes a change to
      # them reviewable. Only the private key is a secret.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" ]]; then
            echo "::error::SSH_KEY is not set; see deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 deploy/ssh/config ~/.ssh/config
          install -m 644 deploy/ssh/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/eudiw-deploy
          chmod 600 ~/.ssh/eudiw-deploy
          ssh -o BatchMode=yes target 'echo "connected to $(hostname)"'

      # Compose interpolates ${...} client-side, here on the runner, and sends
      # the daemon an already-expanded spec. So the values only have to exist in
      # this step's environment; nothing is written to disk and nothing lands on
      # the server.
      #
      # Adding a key means two edits: create the repository secret, and add it
      # below.
      - name: Pull and roll
        env:
          WALLET_PROVIDER_IMAGE: ${{ steps.image.outputs.image }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SIGNINGKEY_KEYSTOREPASSWORD: ${{ secrets.SIGNINGKEY_KEYSTOREPASSWORD }}
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
          SIGNING_CERT_PEM: ${{ vars.SIGNING_CERT_PEM }}
          TOKENSTATUSLISTSERVICE_APIKEY: ${{ secrets.TOKENSTATUSLISTSERVICE_APIKEY }}
        run: |
          set -euo pipefail
          for k in DATABASE_PASSWORD SIGNINGKEY_KEYSTOREPASSWORD SIGNING_KEY_PEM TOKENSTATUSLISTSERVICE_APIKEY; do
            if [[ -z "${!k:-}" ]]; then
              echo "::error::repository secret $k is not set; see deploy/README.md"
              exit 1
            fi
          done
          if [[ -z "${SIGNING_CERT_PEM:-}" ]]; then
            echo "::error::repository variable SIGNING_CERT_PEM is not set; see deploy/README.md"
            exit 1
          fi

          # The signing certificate is the onboarding PEM as downloaded: our
          # certificate, then the CA that issued it. Checked here, so a mistake
          # stops the deploy before anything on the box changes.
          leaf=$(openssl x509 <<< "$SIGNING_CERT_PEM")
          if (( $(grep -c 'BEGIN CERTIFICATE' <<< "$SIGNING_CERT_PEM") < 2 )); then
            echo "::warning::SIGNING_CERT_PEM holds one certificate and no CA. Only this demo's issuer will trust its attestations."
          elif ! openssl verify -CAfile <(awk 'n; /END CERTIFICATE/ {n=1}' <<< "$SIGNING_CERT_PEM") \
                   <(printf '%s\n' "$leaf") >/dev/null; then
            echo "::error::the first certificate in SIGNING_CERT_PEM does not verify against the CA after it"
            exit 1
          fi
          if [[ "$(openssl pkey -pubout <<< "$SIGNING_KEY_PEM")" != "$(openssl x509 -noout -pubkey <<< "$leaf")" ]]; then
            echo "::error::SIGNING_KEY_PEM is not the key of the first certificate in SIGNING_CERT_PEM"
            exit 1
          fi
          echo "signer $(openssl x509 -noout -subject -enddate <<< "$leaf" | tr '\n' ' ')"
          SIGNING_CERT_SHA256=$(openssl x509 -noout -fingerprint -sha256 <<< "$leaf" | cut -d= -f2)
          export SIGNING_CERT_SHA256

          export COMPOSE_ENV_FILES=deploy/stack.env

          # Compose does not recreate a container when only a config's content
          # changes, so the landing page's rendered content goes into its
          # environment as a hash.
          LANDING_SHA256=$(LANDING_SHA256=pending $COMPOSE config --format json | python3 -c '
          import hashlib, json, sys
          c = json.load(sys.stdin)["configs"]
          print(hashlib.sha256((c["landing-html"]["content"] + c["landing-nginx"]["content"]).encode()).hexdigest())')
          export LANDING_SHA256

          recreate=""
          [[ "${{ inputs.force_recreate }}" == "true" ]] && recreate="--force-recreate"

          $COMPOSE pull
          $COMPOSE up -d --remove-orphans $recreate

      # A green `up -d` only means compose accepted the configuration. It does
      # not mean the containers are still running a moment later, so check.
      - name: Verify
        env:
          SIGNING_CERT_PEM: ${{ vars.SIGNING_CERT_PEM }}
        run: |
          set -uo pipefail
          fail=0

          echo "── containers ──"
          for c in nginx-proxy eudiw-wallet-provider-db eudiw-wallet-provider eudiw-landing; do
            state=""
            for _ in $(seq 1 12); do
              state=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo absent)
              [[ "$state" == "running" ]] && break
              sleep 5
            done
            if [[ "$state" == "running" ]]; then
              echo "  ok   $c"
            else
              echo "  FAIL $c ($state)"
              docker logs --tail 20 "$c" 2>&1 | sed 's/^/       /' || true
              fail=1
            fi
          done

          echo "── networks ──"
          for n in proxy-net eudiw-wallet-provider; do
            if docker network inspect "$n" >/dev/null 2>&1; then
              echo "  ok   $n"
            else
              echo "  FAIL $n missing"
              fail=1
            fi
          done

          echo "── provider attached to proxy-net ──"
          if docker inspect -f '{{json .NetworkSettings.Networks}}' eudiw-wallet-provider 2>/dev/null | grep -q '"proxy-net"'; then
            echo "  ok"
          else
            echo "  FAIL the proxy cannot reach the provider"
            fail=1
          fi

          echo "── nginx config valid ──"
          if docker exec nginx-proxy nginx -t >/dev/null 2>&1; then
            echo "  ok"
          else
            docker exec nginx-proxy nginx -t 2>&1 | sed 's/^/       /' || true
            fail=1
          fi

          # Through the proxy, by hostname, so this exercises the vhost rather
          # than the container directly. The path carries WALLET_PROVIDER_PATH:
          # the service moved off the host root when the status list took it.
          #
          # Over https: port 80 answers with a 301 (checked below). --connect-to
          # keeps the edge hostname for SNI, so the certificate is checked too.
          #
          # Retried, because the JVM takes a few seconds past `up -d` before it
          # answers and a 502 in that window is a slow start, not a bad deploy.
          echo "── service answers through the proxy ──"
          host=$(grep -E '^EDGE_HOST=' deploy/stack.env | cut -d= -f2)
          path=$(grep -E '^WALLET_PROVIDER_PATH=' deploy/stack.env | cut -d= -f2)
          code=000
          for _ in $(seq 1 12); do
            code=$(docker run --rm --network proxy-net curlimages/curl:8.11.1 \
                     -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     --connect-to "$host:443:nginx-proxy:443" \
                     "https://$host${path}jwks" || echo 000)
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          if [[ "$code" == "200" ]]; then
            echo "  ok   ${path}jwks returned 200"
          else
            echo "  FAIL ${path}jwks returned $code"
            fail=1
          fi

          # The chain the provider signs with is what it publishes, and what it
          # sends as the x5c of every attestation. Issuers match its first
          # certificate against WE BUILD's Wallet Providers list. The app leaves
          # a self-signed root off the end (dropRootCaIfNeeded), so WE BUILD's
          # CA is in the keystore but not in x5c.
          echo "── /jwks carries SIGNING_CERT_PEM ──"
          jwks=$(docker run --rm --network proxy-net curlimages/curl:8.11.1 \
                   -s --max-time 10 --connect-to "$host:443:nginx-proxy:443" \
                   "https://$host${path}jwks" || true)
          if out=$(JWKS="$jwks" python3 -c '
          import json, os, re
          pem = [re.sub(r"\s", "", b) for b in re.findall(
              r"-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----",
              os.environ["SIGNING_CERT_PEM"], re.S)]
          x5c = json.loads(os.environ["JWKS"])["keys"][0].get("x5c", [])
          n = len(x5c)
          if not (n and x5c == pem[:n] and n >= len(pem) - 1):
              raise SystemExit(f"x5c does not start with SIGNING_CERT_PEM ({n} certificates against {len(pem)})")
          print(f"x5c is SIGNING_CERT_PEM, {n} of its {len(pem)} certificates")
          ' 2>&1); then
            echo "  ok   $out"
          else
            echo "  FAIL $out"
            fail=1
          fi

          # Port 80 is this stack's own server block, not nginx-proxy's, so
          # check it still does what the generated one did: redirect, and serve
          # ACME challenges. A broken ACME location fails only at the next
          # renewal, weeks later, so probe it with a file of our own.
          echo "── port 80 ──"
          http() {
            docker run --rm --network proxy-net curlimages/curl:8.11.1 \
              -s --max-time 10 -H "Host: $host" "http://nginx-proxy$1" "${@:2}" || echo 000
          }
          code=$(http "${path}jwks" -o /dev/null -w '%{http_code}')
          if [[ "$code" == "301" ]]; then
            echo "  ok   http redirects to https"
          else
            echo "  FAIL http ${path}jwks returned $code, expected 301"
            fail=1
          fi
          probe="deploy-probe-${GITHUB_RUN_ID}"
          docker exec nginx-proxy sh -c "mkdir -p /usr/share/nginx/html/.well-known/acme-challenge && echo $probe > /usr/share/nginx/html/.well-known/acme-challenge/$probe"
          if [[ "$(http "/.well-known/acme-challenge/$probe")" == "$probe" ]]; then
            echo "  ok   ACME challenge served over http"
          else
            echo "  FAIL ACME challenge not served: certificate renewal will fail"
            fail=1
          fi
          docker exec nginx-proxy rm -f "/usr/share/nginx/html/.well-known/acme-challenge/$probe"

          [[ "$fail" -eq 0 ]] && echo "deploy verified" || { echo "verification failed"; exit 1; }

      - name: Clean up
        if: always()
        run: docker image prune -f || true
