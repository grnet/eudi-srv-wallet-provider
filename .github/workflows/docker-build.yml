# Build the container image and push it to GHCR.
#
# Build only. Deployment is a separate, manually triggered workflow, so a push
# never changes what is running on a server.
#
# Upstream's publish-to-container-registry.yml triggers only on v*.*.* tags,
# which this fork does not create, so it has never run here. This workflow sits
# alongside it, untouched, and triggers on the branches the fork uses.
#
# The image is built by the jib Gradle plugin rather than a Dockerfile, so there
# is no docker build step. Tagging matches the other repositories: by branch, by
# commit SHA, and as `latest` on the default branch. The SHA tag is the one worth
# deploying, since it names exactly one build.

name: Docker build

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches `java` in gradle/libs.versions.toml.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Pull requests from forks cannot read secrets, and publishing unreviewed
      # code is not a default worth having. Those builds prove the image still
      # builds and stop short of pushing.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          # `source` links the package to this repository.
          labels: |
            org.opencontainers.image.description=Wallet Provider service for the EUDIW stack (GRNET fork). Issues wallet instance attestations and key attestations; see DOCKER.md.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      # The jib block in wallet-provider-service/build.gradle.kts reads these
      # from the environment and sets a label only when its variable is present.
      - name: Build and push with jib
        if: github.event_name != 'pull_request'
        env:
          OCI_CREATED: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          OCI_DESCRIPTION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.description'] }}
          OCI_LICENSES: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.licenses'] }}
          OCI_REVISION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          OCI_SOURCE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.source'] }}
          OCI_TITLE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.title'] }}
          OCI_URL: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.url'] }}
          OCI_VERSION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          OCI_REF_NAME: ${{ github.repository }}
          OCI_VENDOR: GRNET
        run: |
          set -euo pipefail
          # jib takes one --image, so push the first tag and pass the rest via
          # jib.to.tags. Every tag then points at a single manifest instead of
          # several near-identical builds.
          primary=$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)
          others=$(printf '%s' "${{ steps.meta.outputs.tags }}" | tail -n +2 | sed 's|.*:||' | paste -sd, -)
          echo "primary: $primary"
          echo "additional tags: ${others:-none}"
          ./gradlew --no-daemon :wallet-provider-service:jib \
            --image="$primary" \
            ${others:+-Djib.to.tags="$others"}

      - name: Build image without pushing
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew --no-daemon :wallet-provider-service:jibDockerBuild \
            --image=eudi-srv-wallet-provider:pr-${{ github.event.number }}

      # A published image is only useful if it starts. Running it with no
      # configuration must fail in hoplite, which is only reached after the JVM
      # has started and the application classes have loaded, so a broken
      # entrypoint or an incomplete classpath fails here rather than at deploy.
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing $IMAGE"
          docker pull "$IMAGE"

          output=$(docker run --rm "$IMAGE" 2>&1 || true)

          if printf '%s' "$output" | grep -q "Error loading config"; then
            echo "Image starts and reaches configuration loading."
          else
            echo "::error::the image did not start as expected"
            printf '%s\n' "$output" | head -40
            exit 1
          fi
